name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to release.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v1.5.12.
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" && "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be semver with a leading v, for example v1.5.12."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd web/frontend && npm ci

      - name: Audit frontend dependencies
        run: cd web/frontend && npm audit

      - name: Check frontend
        run: cd web/frontend && npm test && npm run lint && npm run type-check

      - name: Build frontend
        run: cd web/frontend && npm run build

      - name: Copy frontend assets
        run: |
          mkdir -p internal/web
          rm -rf internal/web/dist
          cp -r web/frontend/dist internal/web/

      - name: Vet backend
        run: go vet ./api-docs ./cmd/... ./internal/... ./pkg/... ./tests

      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/... ./internal/... ./pkg/...

      - name: Run backend tests
        run: go test ./api-docs ./cmd/... ./internal/... ./pkg/... ./tests

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
