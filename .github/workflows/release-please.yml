name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    name: Build release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  publish-images:
    name: Publish container images
    needs: [release-please, publish-release]
    if: needs.release-please.outputs.release_created == 'true' && needs.publish-release.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-dev-images.yml
    with:
      source_repository: ${{ github.repository }}
      upstream_ref: ${{ needs.release-please.outputs.tag_name }}
      image_channel: ${{ needs.release-please.outputs.version }}
      variants: all
      publish_latest: true
    secrets: inherit
